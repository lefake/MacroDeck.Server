    <script>
        let red = "rgb(255, 0, 0)"
        let gray = "rgb(128,128,128)"

        for (let i = 0; i < 8; i++) {
            var s = document.getElementById('s' + i), m = document.getElementById('m' + i);
            s.onmouseup = function() {
                send_gain(i, this.value);
            }
            m.onclick = function() {
                toggle_button(i);
            }
        }


        setInterval(async function()
        {
            for (let i = 0; i < 8; i++)
            {
                let volumes = await get_volumes(i);
                apply_volume(i, volumes.l, volumes.r);
            }
        }, 5000);


        function toggle_button(s_id)
        {
            if (document.getElementById('m' + s_id).style.background == red)
            {
                set_button_color(s_id, gray);
                send_mute(s_id, "False");
            }
            else
            {
                set_button_color(s_id, red);
                send_mute(s_id, "True");
            }
        }

        function set_button_color(s_id, color)
        {
            document.getElementById('m' + s_id).style.background = color;
        }

        function apply_volume(s_id, r, l)
        {

        }


        function send_mute(s_id, value)
        {
            fetch(`/mute_strip?s=${s_id}&v=${value}`, {method: 'post'});
        };

        function send_gain(s_id, value)
        {
          fetch(`/set_gain?s=${s_id}&v=${value}`, {method: 'post'});
        };

        async function get_volumes(s_id)
        {
            const rsp =  await fetch(`/volume?s=${s_id}`, {method: 'get'});
            return rsp.json();
        }
    </script>
    <style>
        .slider[orient=vertical] {
          width: 15px;
          height: 175px;
          padding: 0 5px;
          border-radius: 5px;
          background: #d3d3d3;
          outline: none;
          opacity: 0.7;
          -webkit-transition: .2s;
          transition: opacity .2s;
        }

        .slider:hover {
          opacity: 1;
        }

        .slider::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          width: 25px;
          height: 25px;
          border-radius: 50%;
          background: #04AA6D;

        }

        div.margin {margin-bottom: 10px;}

        .grid-container {
